name: Callback
options:
  bundleIdPrefix: cx.viz
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "16"
    DEVELOPMENT_TEAM: "7JF6XQC536"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
packages:
  DesignSystem:
    path: Packages/DesignSystem
  AppCore:
    path: Packages/AppCore
targets:
  Callback:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: DesignSystem
      - package: AppCore
    # Explicit scheme: `xcodebuild test TEST_RUNNER_FOO=` does not reach the UI
    # test runner on this toolchain, so the screenshot output directory has to be
    # declared in the test action itself.
    scheme:
      testTargets:
        - CallbackTests
        - CallbackUITests
      environmentVariables:
        - variable: SCREENSHOT_DIR
          value: $(SRCROOT)/docs/store-assets/ios
          isEnabled: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cx.viz.callback
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Callback
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_BackgroundColorName: AccentColor
  CallbackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/CallbackTests
    dependencies:
      - target: Callback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cx.viz.callback.tests
  CallbackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/CallbackUITests
    dependencies:
      - target: Callback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cx.viz.callback.uitests
        TEST_TARGET_NAME: Callback
